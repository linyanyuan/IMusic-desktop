<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#5B7FFF;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#C74CFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4081;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background with gradient -->
  <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="url(#gradient)"/>

  <!-- White "IM" text -->
  <text x="256" y="340" font-family="Arial, sans-serif" font-size="240" font-weight="bold" fill="white" text-anchor="middle">IM</text>
</svg>
