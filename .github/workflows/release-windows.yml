# IMusic Desktop（Electron）打包 + 发布到 GitHub Releases
#
# 触发：推送 v* 标签，例如
#   git tag v2.3.3
#   git push origin v2.3.3
#
# 产物：
#   - IMusic-Setup-<version>-x64.exe   NSIS 安装版
#   - IMusic-<version>-x64.zip          绿色免安装版
#   - desktop-update.json               更新清单（应用内更新器读取）
#   - SHA256SUMS.txt                    所有产物的 sha256
#
# 注意：当前没有代码签名证书，安装包未签名，用户首次运行会看到
# Windows SmartScreen 提示（仍可选「仍要运行」）。接入 EV 证书后取消下面
# WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD 两个 secret 的注释即可自动签名。

name: Release (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（需与 package.json 的 version 一致，如 2.3.3）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: 校验 tag 与 package.json 版本一致
        shell: bash
        env:
          # 经 env 传入而不是 ${{ }} 插值：手动触发时 inputs.version 是人填的，
          # 直接插进 shell 就是命令注入面。
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 手动触发（workflow_dispatch）时 GITHUB_REF_NAME 是分支名而非 tag，
          # 这时用 inputs.version 推导期望 tag；只有 tag 推送才是真正的 vX.Y.Z。
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && [ -n "${INPUT_VERSION}" ]; then
            TAG="v${INPUT_VERSION}"
            echo "::warning::手动触发模式：按 ${TAG} 校验版本，但 Release 的" \
              "tag_name 仍是 ${GITHUB_REF_NAME}（分支名）。建议改用打 tag 发布。"
          fi
          EXPECT="${TAG#v}"
          ACTUAL="$(node -p "require('./electron-app/package.json').version")"
          echo "ref=${GITHUB_REF_NAME} type=${GITHUB_REF_TYPE}"
          echo "期望 tag=${EXPECT}  package.json=${ACTUAL}"
          if [ "${EXPECT}" != "${ACTUAL}" ]; then
            echo "::error::tag (${EXPECT}) 与 package.json 的 version" \
              "(${ACTUAL}) 不一致。请先改 version 并提交，再打同名 tag。"
            exit 1
          fi

      - name: 安装依赖
        working-directory: electron-app
        run: npm ci

      - name: 类型检查 + 单元测试
        working-directory: electron-app
        run: |
          npm run typecheck
          npm test

      - name: 构建（渲染层 + 主进程 + preload）
        working-directory: electron-app
        run: npm run build

      - name: 打包 NSIS + zip
        working-directory: electron-app
        run: npx electron-builder --publish never
        env:
          # 接入代码签名证书后，在仓库 Secrets 里配这两个值即可自动签名
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # 注意：**不要**在这里设 GH_TOKEN / GITHUB_TOKEN。
          # electron-builder 会把这两个变量当成「用 github 作为 publish provider」的隐式信号
          # （resolvePublishConfigurations），即便加了 --publish never 也会走进
          # update-info 生成路径，在仓库信息解析失败时返回含 null 的 publishConfigs，
          # 崩在 updateInfoBuilder 的 publishConfig.channel。
          # 资产上传由下面的 softprops/action-gh-release 负责，它自己会用
          # secrets.GITHUB_TOKEN，与这里无关。

      - name: 生成更新清单与校验和
        shell: bash
        working-directory: electron-app
        env:
          # 经 env 传入而不是 ${{ }} 插值：tag 名由推 tag 的人控制，
          # 直接插进 shell 等于给推送者一个命令注入面（actionlint 亦会告警）。
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          FULL_VERSION="$(node -p "require('./package.json').version")"
          cd release

          # 定位实际产物：不硬编码 -x64。electron-builder 的 zip 默认名是
          # <productName>-<version>-win.zip（带平台名而不是 arch），曾经因此
          # 在 CI 里报 "sha256sum: IMusic-<v>-x64.zip: No such file or directory"。
          # 虽然 package.json 已用 win.artifactName 固定为 -<arch>，这里仍用 glob
          # 定位，以后改配置/换 arch 也不会再对不上。
          pick() {
            # 先按当前版本号收窄，避免 release/ 里残留旧版本产物时选错。
            # 用 compgen -G 而不是 ls：它会自己展开 glob，无匹配时返回空，
            # 不会像加了引号的 ls 那样把字面 pattern 当作文件名。
            local hit
            hit="$(compgen -G "$1" 2>/dev/null | head -n1 || true)"
            if [ -z "${hit}" ]; then
              hit="$(compgen -G "$2" 2>/dev/null | head -n1 || true)"
            fi
            printf '%s' "${hit}"
          }

          SETUP_EXACT="IMusic-Setup-${FULL_VERSION}*.exe"
          SETUP_LOOSE='IMusic-Setup-*.exe'
          ZIP_EXACT="IMusic-${FULL_VERSION}*.zip"
          ZIP_LOOSE='IMusic-*.zip'

          SETUP_FULL="$(pick "${SETUP_EXACT}" "${SETUP_LOOSE}")"
          ZIP_FULL="$(pick "${ZIP_EXACT}" "${ZIP_LOOSE}")"

          if [ -z "${SETUP_FULL}" ]; then
            echo "::error::找不到安装包（IMusic-Setup-${FULL_VERSION}*.exe）。目录内容："
            ls -1
            exit 1
          fi
          if [ -z "${ZIP_FULL}" ]; then
            echo "::error::找不到 zip 包（IMusic-${FULL_VERSION}*.zip）。目录内容："
            ls -1
            exit 1
          fi
          # blockmap 只在 nsis 产物上生成，缺了不影响更新，仅提示
          if [ ! -f "${SETUP_FULL}.blockmap" ]; then
            echo "::warning::没有 ${SETUP_FULL}.blockmap（增量更新会退化为全量下载）"
          fi

          echo "解析到安装包：${SETUP_FULL}"
          echo "解析到绿色包：${ZIP_FULL}"

          BASE="https://github.com/${REPO}/releases/download/${REF}"

          SHA256="$(sha256sum "${SETUP_FULL}" | awk '{print $1}')"

          # manifest.version 保留完整版本号：更新端的 parseVersion 支持 +build，
          # 且 build 号参与比较（pub_semver 语义），少了它就分不出 2.3.3+7 / 2.3.3+8。
          cat > desktop-update.json <<EOF
          {
            "version": "${FULL_VERSION}",
            "downloadUrl": "${BASE}/${SETUP_FULL}",
            "sha256": "${SHA256}",
            "changelog": "见 Release notes：${BASE}"
          }
          EOF

          # 全产物校验和（绿色包 zip + 安装包）
          sha256sum "${ZIP_FULL}" "${SETUP_FULL}" > SHA256SUMS.txt

          echo "---- desktop-update.json ----"
          cat desktop-update.json
          echo "---- SHA256SUMS.txt ----"
          cat SHA256SUMS.txt
          echo "---- release dir ----"
          ls -1

      - name: 上传 Release 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: IMusic Desktop ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            electron-app/release/IMusic-Setup-*.exe
            electron-app/release/IMusic-*.zip
            electron-app/release/desktop-update.json
            electron-app/release/SHA256SUMS.txt
            electron-app/release/*.blockmap
          fail_on_unmatched_files: true
