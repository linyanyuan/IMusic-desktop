name: deepvibe_desktop
description: "IMusic — a modern desktop music player."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  window_manager: ^0.5.1
  dio: ^5.9.2
  audioplayers: ^6.1.0
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  file_selector: ^1.0.3
  crypto: ^3.0.6
  shared_preferences: ^2.3.4
  desktop_multi_window: ^0.3.0
  package_info_plus: ^8.1.0
  pub_semver: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
